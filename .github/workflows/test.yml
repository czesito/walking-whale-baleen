# Spec §14.7: lint and unit tests everywhere; integration tests against real tools on Linux,
# then the integration suite again with networking disabled (AC-10).
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  linux:
    name: lint, unit and integration (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Python 3.12 venv with locked dev dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv --require-hashes -r requirements-dev.lock
          uv pip install --python .venv --no-deps -e .

      - name: Cache pinned tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/baleen-ci
          key: baleen-ci-tools-${{ hashFiles('scripts/ci_install_libreoffice.py', 'scripts/runtimes.json') }}

      - name: External tools (pinned LibreOffice and veraPDF; FFmpeg and Java from apt)
        run: |
          sudo apt-get update
          # The pinned LibreOffice 26.8 is unpacked below: Ubuntu's 24.2 writes PDF/A-1b files that
          # veraPDF rejects, and CI must test what the bundles ship. Apt provides its libraries.
          sudo apt-get install -y --no-install-recommends \
            ffmpeg default-jre-headless fonts-liberation fonts-dejavu-core fonts-wqy-microhei \
            libxinerama1 libxrandr2 libdbus-1-3 libsm6 libice6 libxslt1.1 libnss3 libx11-xcb1 libgl1 libegl1
          .venv/bin/python scripts/ci_install_libreoffice.py --dest "$RUNNER_TEMP/libreoffice" --cache "$HOME/.cache/baleen-ci" > "$RUNNER_TEMP/soffice.txt"
          echo "BALEEN_SOFFICE=$(tail -1 "$RUNNER_TEMP/soffice.txt")" >> "$GITHUB_ENV"
          .venv/bin/python scripts/ci_install_verapdf.py --dest "$RUNNER_TEMP/verapdf" --cache "$RUNNER_TEMP/cache"
          echo "BALEEN_VERAPDF=$RUNNER_TEMP/verapdf/verapdf" >> "$GITHUB_ENV"

      - name: Doctor
        run: .venv/bin/python -m baleen doctor

      - name: Lint
        run: .venv/bin/ruff check src tests scripts

      - name: Unit tests
        run: .venv/bin/python -m pytest tests/unit -q

      - name: Integration tests
        env:
          BALEEN_REQUIRE_TOOLS: "1"
        run: .venv/bin/python -m pytest tests/integration -q

      - name: Integration tests offline (AC-10)
        env:
          BALEEN_REQUIRE_TOOLS: "1"
        run: |
          # Run the suite in a fresh network namespace whose only routes lead to a dummy interface.
          # Every packet that is not loopback, and every DNS query, is rejected and counted; any count
          # fails the job, so an outbound attempt cannot hide behind a test that tolerates errors.
          cat > "$RUNNER_TEMP/offline.sh" <<'EOF'
          set -uo pipefail
          ip link set lo up
          ip link add egress0 type dummy
          ip addr add 192.0.2.1/24 dev egress0
          ip link set egress0 up
          ip route add default via 192.0.2.254 dev egress0
          ip -6 addr add 2001:db8::1/64 dev egress0 nodad 2>/dev/null || true
          ip -6 route add default via 2001:db8::fe dev egress0 2>/dev/null || true
          for ipt in iptables ip6tables; do
            $ipt -A OUTPUT -o lo -p udp --dport 53 -j REJECT
            $ipt -A OUTPUT -o lo -p tcp --dport 53 -j REJECT
            # Count only packets sent by the test user's processes (Baleen and its tools). The kernel's
            # own ICMPv6 router solicitations / MLD reports on egress0 are dropped without counting.
            $ipt -A OUTPUT ! -o lo -m owner --uid-owner "$RUN_AS" -j REJECT
            $ipt -A OUTPUT ! -o lo -j DROP
          done
          sudo -u "$RUN_AS" --preserve-env=PATH,HOME,BALEEN_REQUIRE_TOOLS,BALEEN_VERAPDF,BALEEN_SOFFICE,PYTHONIOENCODING \
            .venv/bin/python -m pytest tests/integration -q -p no:cacheprovider
          rc=$?
          attempts=0
          for ipt in iptables ip6tables; do
            $ipt -L OUTPUT -v -n -x
            n=$($ipt -L OUTPUT -v -n -x | awk '/REJECT/ {s += $1} END {print s + 0}')
            attempts=$((attempts + n))
          done
          echo "outbound attempts: $attempts"
          if [ "$attempts" -ne 0 ]; then
            echo "::error::AC-10: $attempts outbound packet(s) during the offline integration run"
            exit 1
          fi
          exit $rc
          EOF
          sudo RUN_AS="$(id -un)" PATH="$PATH" HOME="$HOME" BALEEN_REQUIRE_TOOLS=1 \
            BALEEN_VERAPDF="$BALEEN_VERAPDF" BALEEN_SOFFICE="$BALEEN_SOFFICE" PYTHONIOENCODING=utf-8 \
            unshare --net bash "$RUNNER_TEMP/offline.sh"

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python 3.12 venv with locked dev dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv --require-hashes -r requirements-dev.lock
          uv pip install --python .venv --no-deps -e .
      - name: Unit tests
        run: uv run --no-sync --python .venv python -m pytest tests/unit -q
