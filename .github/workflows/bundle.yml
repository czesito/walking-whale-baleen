# Spec §14.7: build the portable bundles, smoke-test them, check that a run leaves nothing behind
# (AC-11), and on a version tag draft a GitHub Release with the zips, SHA256SUMS and the GPL sources.
name: bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: macos-latest   # Apple silicon
            platform: mac-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      - name: Host Python (orchestration only; the bundle brings its own)
        run: |
          uv python install 3.12
          echo "HOST_PY=$(uv python find 3.12)" >> "$GITHUB_ENV"
          echo "VERSION=$(uv run --no-project --python 3.12 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_ENV"

      - name: Download cache
        uses: actions/cache@v6
        with:
          path: .scratch/cache
          key: runtimes-${{ matrix.platform }}-${{ hashFiles('scripts/runtimes.json', 'requirements.lock', 'scripts/build-requirements.lock') }}

      - name: Build bundle (includes the smoke test)
        run: |
          "$HOST_PY" scripts/build_bundle.py --platform "${{ matrix.platform }}" --cache .scratch/cache \
            --work "$RUNNER_TEMP/bundle-work"

      - name: Extract the zip into a fresh folder with spaces
        run: |
          dest="$RUNNER_TEMP/Baleen test folder"
          mkdir -p "$dest"
          zip="dist/baleen-$VERSION-${{ matrix.platform }}.zip"
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -x -k "$zip" "$dest"
          else
            "$HOST_PY" -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$zip" "$dest"
          fi
          echo "EXTRACTED=$dest/Baleen-$VERSION-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: Smoke test from the extracted folder, with the clean-uninstall check (AC-11)
        run: |
          snap="$HOST_PY scripts/snapshot_profile.py"
          out="$RUNNER_TEMP/ac11"
          mkdir -p "$out"
          # Control pair: what changes in the profile with no Baleen run at all (runner background noise).
          $snap snap "$out/control-1.json"
          sleep 20
          $snap snap "$out/control-2.json"
          $snap diff "$out/control-1.json" "$out/control-2.json" || true
          $snap snap "$out/before.json"
          "$HOST_PY" scripts/build_bundle.py --smoke-only "$EXTRACTED" --work "$RUNNER_TEMP/smoke-work"
          $snap snap "$out/after.json"
          $snap diff "$out/before.json" "$out/after.json" --baseline "$out/control-2.diff.json" --fail

      - name: GPL sources (§15)
        run: |
          "$HOST_PY" scripts/fetch_gpl_sources.py --platform "${{ matrix.platform }}" \
            --versions "dist/Baleen-$VERSION-${{ matrix.platform }}/runtime/VERSIONS.json" \
            --out dist/gpl-sources --cache .scratch/cache --work "$RUNNER_TEMP/gpl-work"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/baleen-*.zip
            dist/baleen-*.zip.sha256
            dist/gpl-sources/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ac11-${{ matrix.platform }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/ac11/*.diff.json

  release:
    name: draft release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: assets
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: assets
        run: |
          find . -maxdepth 1 -name 'baleen-*.zip.sha256' -delete
          { sha256sum baleen-*.zip; (cd gpl-sources && sha256sum *); } > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Baleen ${GITHUB_REF_NAME#v}" \
            --notes "Portable bundles for Windows (x64) and macOS (Apple silicon). Check downloads against SHA256SUMS. The gpl-sources archives are the corresponding sources of the bundled FFmpeg builds (see GPL-SOURCES-<platform>.txt)." \
            assets/baleen-*.zip assets/SHA256SUMS assets/gpl-sources/*
