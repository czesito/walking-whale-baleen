[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "walking-whale-baleen"
version = "0.1.0"
description = "Baleen by Walking Whale: convert legacy archive files into archival formats and verify every one."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Walking Whale Co., Ltd." }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: System :: Archiving",
]
# Spec section 4: the only runtime dependencies.
dependencies = [
    "starlette",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "pillow",
    "pypdf",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "playwright", "httpx2"]  # httpx2: Starlette's TestClient (AC-12 tests)

[project.scripts]
baleen = "baleen.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baleen = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs real bundled tools (skips when a tool is missing locally)",
    "slow: long-running (benchmarks, large fixtures)",
    "ui: browser tests with Playwright",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",   # assert in tests
    "S603",   # subprocess without shell: argument lists are the rule (SEC-8)
    "S607",   # partial executable paths are resolved by tools.py
    "B008",
    "S105",   # "PASS" is a check state, not a password
    "S110",   # deliberate best-effort OS calls
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S310", "S311", "S108", "S324", "E501"]
